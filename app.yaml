kind: wasmer.io/App.v0
name: sijalan
owner: frenkiherlambang
package: .
locality:
  regions:
    - fr-roub1
env:
  APP_NAME: SIJALAN
  APP_ENV: production
  APP_KEY: 'base64:AWn+a9VeD/DBdAFLjWdDoCw/uJL2Cmi+/J4ICQGod6E='
  APP_DEBUG: 'false'
  APP_URL: https://sijalan.wasmer.app
  APP_LOCALE: id
  APP_FALLBACK_LOCALE: en
  APP_FAKER_LOCALE: id_ID
  APP_TIMEZONE: Asia/Jakarta
  APP_MAINTENANCE_DRIVER: file
  BCRYPT_ROUNDS: '12'
  LOG_CHANNEL: stderr
  LOG_LEVEL: warning
  DB_CONNECTION: sqlite
  DB_DATABASE: /app/storage/database.sqlite
  SESSION_DRIVER: database
  SESSION_LIFETIME: '120'
  SESSION_ENCRYPT: 'false'
  SESSION_PATH: /
  CACHE_STORE: database
  QUEUE_CONNECTION: sync
  FILESYSTEM_DISK: local
  BROADCAST_CONNECTION: log
  MAIL_MAILER: log
  INERTIA_SSR_ENABLED: 'false'
capabilities:
  instaboot:
    mode: null
    requests:
    - path: /up
volumes:
- name: data
  mount: /app/storage
health_checks:
- !http
  path: /up
  method: get
  timeout: 10s
  interval: 30s
  unhealthy_threshold: 3
  healthy_threshold: 1
debug: true
scaling:
  mode: single_concurrency
jobs:
- name: migrate
  trigger: pre-deployment
  timeout: 10m
  action:
    execute:
      command: artisan
      cli_args:
      - migrate
      - --force
description: SIJALAN - Sistem Informasi Perjalanan Dinas
app_id: da_2J7IAtxUdEXa
