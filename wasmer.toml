[package]
name = "frenkiherlambang/sijalan"
version = "0.1.0"
description = "SIJALAN - Sistem Informasi Perjalanan Dinas"

[dependencies]
"php/php" = "=8.3.4"

[fs]
"/app/" = "."
"/php-config" = "php-config"

[[command]]
name = "run"
module = "php/php:php"
runner = "wasi"

[command.annotations.wasi]
main-args = ["-t", "/app/public", "-S", "0.0.0.0:8080"]
env = ["PHPRC=/php-config/"]

[[command]]
name = "artisan"
module = "php/php:php"
runner = "wasi"

[command.annotations.wasi]
main-args = ["/app/artisan"]
env = ["PHPRC=/php-config/"]
